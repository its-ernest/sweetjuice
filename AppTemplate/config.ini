[app]
name = Sweet Juice
package = com.myapp.app
icon=icon.png
description = A demonstration app to showcase the capabilities of Sweet Juice.
version = 1.0
versionCode = 1

[build]
# Build Type: debug or release
type = debug
# Build Architectures: arm64, armv7, x86_64, universal
android_target = arm64
ios_target = arm64

[android]
# Minimum API version
# Android 6.0
min_api = 23
# Native Compiled Bindings
aar_name = sweetjuice.aar

# APK/AAB Signing Configurations
## Change these values to your own keystore and key information for signing the APK/AAB
keystore = test.jks
keystore_pass = passtest
key_password = passtest
alias = key0

[ios]
# Minimum iOS version
min_version = 13
# Native Compiled Bindings
xframework_name = Sweetjuice.xcframework

[cross]
# GitHub configurations for cross-compilation
# Setup this by running 'juice --setup cross'
github_user =
cross_repo_path =
